<style>
:root {
  --bg: #060d1c; --flaeche: #0d1c2d; --flaeche-hoch: #122131; --rand: #27384d;
  --text: #d4e4fa; --leise: #9aa6bd; --akzent: #00f5ff;
  --critical: #ff5f6d; --high: #ffa45c; --medium: #f2d15c; --low: #6cb6ff; --info: #9aa6bd;
  --ok: #00d084;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; font-family: var(--sans); color: var(--text); font-size: 15px; line-height: 1.55;
  background: radial-gradient(ellipse 80% 50% at 0% 0%, rgba(0,245,255,0.07), transparent 60%), var(--bg); }
.seite { max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; }
.mono { font-family: var(--mono); }
.leise { color: var(--leise); }
a { color: var(--akzent); }

header.kopf { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  padding-bottom: 24px; border-bottom: 1px solid var(--rand); }
.marke { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--akzent); }
h1 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.15; margin: 8px 0 6px; letter-spacing: -.01em; }
.quelle { font-size: 14px; color: var(--leise); }
.quelle b { color: var(--text); font-weight: 600; }
.sha { font-family: var(--mono); font-size: 12px; color: var(--leise); word-break: break-all; margin-top: 4px; }
.offline { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(0,208,132,.45);
  background: rgba(0,208,132,.08); color: var(--ok); border-radius: 999px; padding: 6px 14px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.offline::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

.kacheln { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 28px 0; }
.kachel { background: var(--flaeche); border: 1px solid var(--rand); border-radius: 10px; padding: 16px 18px; }
.kachel-w { font-size: 32px; font-weight: 700; line-height: 1.1; color: var(--akzent); }
.kachel-t { font-weight: 600; margin-top: 4px; }
.kachel-x { font-size: 13px; color: var(--leise); margin-top: 2px; }
.balken { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--flaeche-hoch); margin-top: 10px; }
.balken span { display: block; height: 100%; }

h2 { font-size: 21px; margin: 40px 0 6px; }
.abschnitt-x { color: var(--leise); margin: 0 0 16px; font-size: 14px; }

.filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.chip { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
  border: 1px solid var(--rand); background: var(--flaeche); color: var(--leise); border-radius: 999px; padding: 6px 12px; }
.chip[aria-pressed="true"] { border-color: var(--akzent); color: var(--akzent); background: rgba(0,245,255,.08); }
.chip .zahl { opacity: .75; margin-left: 4px; }
.schalter { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--leise); cursor: pointer; }

.befund { position: relative; background: var(--flaeche); border: 1px solid var(--rand); border-radius: 10px;
  padding: 18px 20px 18px 24px; margin-bottom: 12px; overflow: hidden; }
.befund::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--farbe, var(--info)); }
.befund-kopf { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stufe { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; border-radius: 5px; padding: 3px 8px;
  color: var(--farbe); border: 1px solid var(--farbe); background: color-mix(in srgb, var(--farbe) 12%, transparent); }
.marker { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; border-radius: 5px; padding: 3px 8px;
  border: 1px solid var(--rand); color: var(--leise); }
.marker.belegt { color: var(--text); border-color: #3b5370; }
.regel { font-family: var(--mono); font-size: 12px; color: var(--leise); margin-left: auto; }
.befund h3 { margin: 10px 0 2px; font-size: 18px; }
.betrifft { font-size: 14px; color: var(--leise); }
.betrifft b { color: var(--text); font-weight: 600; }
.befund p { margin: 10px 0 0; }
.empfehlung { margin-top: 12px; padding: 10px 14px; border-radius: 8px; background: rgba(0,245,255,.05);
  border: 1px solid rgba(0,245,255,.18); font-size: 14px; }
.empfehlung::before { content: "Empfehlung"; display: block; font-family: var(--mono); font-size: 11px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--akzent); margin-bottom: 2px; }
.beleg { margin-top: 12px; font-family: var(--mono); font-size: 12.5px; background: #04101e; border: 1px solid var(--rand);
  border-radius: 8px; padding: 10px 14px; color: var(--leise); overflow-x: auto; }
.beleg div + div { margin-top: 4px; }
.beleg .k { color: #6f86a6; display: inline-block; min-width: 72px; }
.beleg .v { color: var(--text); white-space: pre-wrap; word-break: break-word; }
details.liste { margin-top: 10px; font-size: 14px; }
details.liste summary { cursor: pointer; color: var(--akzent); }
details.liste ul { margin: 8px 0 0; padding-left: 20px; columns: 2; }
.leer { padding: 28px; text-align: center; border: 1px dashed var(--rand); border-radius: 10px; color: var(--leise); }
.leer.gut { color: var(--ok); border-color: rgba(0,208,132,.45); }

table { width: 100%; border-collapse: collapse; background: var(--flaeche); border: 1px solid var(--rand); border-radius: 10px; overflow: hidden; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--rand); vertical-align: top; font-size: 14px; }
th { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--leise); font-weight: 500; background: var(--flaeche-hoch); }
tr:last-child td { border-bottom: none; }
td.pfad { font-family: var(--mono); font-size: 12px; color: var(--leise); word-break: break-all; }
.pol { display: inline-block; font-family: var(--mono); font-size: 11px; border: 1px solid var(--rand); border-radius: 5px;
  padding: 1px 6px; margin: 2px 4px 2px 0; color: var(--leise); }

.luecken { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.luecke { background: var(--flaeche); border: 1px solid rgba(198,193,242,.35); border-radius: 10px; padding: 14px 16px; }
.luecke-t { font-weight: 600; }
.luecke-x { font-size: 13px; color: var(--leise); margin-top: 4px; }
.luecke .marker { margin-top: 8px; display: inline-block; }

.aufgaben { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.gruppe { background: var(--flaeche); border: 1px solid var(--rand); border-radius: 10px; padding: 16px 18px; }
.gruppe.sofort { border-color: color-mix(in srgb, var(--critical) 55%, var(--rand)); }
.gruppe-t { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
.gruppe.sofort .gruppe-t { color: var(--critical); }
.gruppe.pruefen .gruppe-t { color: var(--medium); }
.gruppe-x { font-size: 13px; color: var(--leise); margin-bottom: 10px; }
.aufgabe { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--rand); }
.aufgabe:first-of-type { border-top: none; }
.aufgabe input { margin-top: 4px; accent-color: var(--ok); }
.aufgabe-t { font-weight: 600; }
.aufgabe-a { font-size: 13px; color: var(--leise); }
.aufgabe a { font-size: 13px; white-space: nowrap; margin-left: auto; padding-left: 8px; }
.aufgabe input:checked ~ div .aufgabe-t { text-decoration: line-through; color: var(--leise); }
.hinweis-allg { margin-top: 14px; font-size: 13px; color: var(--leise); border-left: 3px solid var(--akzent);
  padding: 8px 12px; background: rgba(0,245,255,.04); border-radius: 0 8px 8px 0; }
.block { margin-top: 14px; }
.block-t { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--akzent); margin-bottom: 4px; }
.block ol { margin: 4px 0 0; padding-left: 22px; }
.block ol li { margin: 3px 0; }
.befehl { margin-top: 8px; font-family: var(--mono); font-size: 12.5px; background: #04101e; border: 1px solid var(--rand);
  border-radius: 8px; padding: 8px 12px; color: var(--text); overflow-x: auto; white-space: pre; }
.zwei-spalten { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
details.technik { margin-top: 14px; font-size: 14px; }
details.technik > summary { cursor: pointer; color: var(--leise); font-family: var(--mono); font-size: 12px; letter-spacing: .06em; }
td.tun { font-size: 13px; color: var(--leise); }
.luecke-tun { font-size: 13px; margin-top: 6px; }
.luecke-tun::before { content: "So prüfen: "; color: var(--akzent); font-weight: 600; }

footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--rand); font-size: 13px; color: var(--leise);
  display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

@media (max-width: 760px) {
  .kacheln { grid-template-columns: repeat(2, 1fr); }
  .aufgaben, .zwei-spalten { grid-template-columns: 1fr; }
  .luecken { grid-template-columns: 1fr; }
  .regel { margin-left: 0; width: 100%; }
  details.liste ul { columns: 1; }
}

@media print {
  :root { --bg: #fff; --flaeche: #fff; --flaeche-hoch: #f3f6fa; --rand: #d5dde8; --text: #111827; --leise: #4b5563; --akzent: #0b7285; }
  body { background: #fff; font-size: 12px; }
  .seite { padding: 0; max-width: none; }
  .filter, .schalter { display: none !important; }
  .befund, .gruppe { break-inside: avoid; }
  details.technik { display: none; }
  .beleg { background: #f8fafc; }
  .offline { color: #047857; border-color: #047857; background: none; }
  details.liste > ul { display: block; }
}
</style>

  }
  an(filter, knopf("alle", "Alle", gesamt));
  STUFEN.forEach(function (s) { if (schwere[s]) an(filter, knopf(s, s, schwere[s])); });
  var schalter = el("label", "schalter");
  var nurBox = el("input");
  nurBox.type = "checkbox";
  nurBox.addEventListener("change", function () { nurBelegt = nurBox.checked; zeigen(); });
  an(schalter, nurBox, document.createTextNode("nur belegte"));
  an(filter, schalter);
  an(seite, filter);

  var liste = el("div");
  an(seite, liste);

  function block(titel, inhalt) {
    var b = el("div", "block");
    an(b, el("div", "block-t", titel), inhalt);
    return b;
  }

  function befundKarte(f, i) {
    var hilfe = HILFE[f.check_id];
    var karte = el("article", "befund");
    karte.id = "befund-" + i;
    karte.style.setProperty("--farbe", farbe(f.severity));
    var kz = el("div", "befund-kopf");
    an(kz, el("span", "stufe", String(f.severity || "").toUpperCase()),
       el("span", "marker" + (f.bewertet ? " belegt" : ""), f.bewertet ? "belegt" : "Hinweis"),
       f.owasp ? el("span", "marker", "OWASP " + f.owasp) : null,
       el("span", "regel", f.check_id));
    an(karte, kz, el("h3", null, hilfe ? hilfe.aufgabe : f.title));
    var betrifft = el("div", "betrifft");
    an(betrifft, document.createTextNode("Betrifft: "), el("b", null, f.subject));
    an(karte, betrifft);
    if (f.affected && f.affected.length) {
      var d = el("details", "liste");
      an(d, el("summary", null, f.affected.length + " betroffene APIs anzeigen"));
      var ul = el("ul");
      f.affected.forEach(function (a) { an(ul, el("li", null, a)); });
      an(karte, an(d, ul));
    }
    if (hilfe) {
      var spalten = el("div", "zwei-spalten");
      an(spalten, block("Was bedeutet das?", el("div", null, hilfe.klartext)),
         block("Was kann passieren?", el("div", null, hilfe.risiko)));
      an(karte, spalten);
      var ol = el("ol");
      hilfe.schritte.forEach(function (s) { an(ol, el("li", null, s)); });
      an(karte, block("So beheben Sie es im API Gateway", ol));
      if (hilfe.hinweis) an(karte, el("div", "hinweis-allg", hilfe.hinweis));
      var pruef = el("div");
      an(pruef, el("div", null, hilfe.pruefen), hilfe.befehl ? el("div", "befehl", hilfe.befehl) : null);
      an(karte, block("So prüfen Sie den Erfolg", pruef));
      if (hilfe.doku) {
        var quelleDoku = el("div", "block");
        an(quelleDoku, link("IBM-Dokumentation: " + hilfe.doku[0] + " ↗", DOKU + hilfe.doku[1], true));
        an(karte, quelleDoku);
      }
    } else if (f.remediation) {
      an(karte, el("p", null, f.reason), el("div", "empfehlung", f.remediation));
    }
    var technik = el("details", "technik");
    an(technik, el("summary", null, "Technische Details"));
    an(technik, el("p", null, f.reason));
    (f.evidence || []).forEach(function (e) {
      var beleg = el("div", "beleg");
      [["Fundstelle", e.pointer], ["Auszug", e.excerpt], ["Notiz", e.note]].forEach(function (p) {
        if (!p[1]) return;
        var zeile = el("div");
        an(zeile, el("span", "k", p[0]), el("span", "v", p[1]));
        an(beleg, zeile);
      });
      an(technik, beleg);
    });
    an(karte, technik);
    return karte;
  }

  function zeigen() {
    liste.textContent = "";
    if (!befunde.length) {
      an(liste, el("div", "leer gut", "Keine Befunde – die geprüften Regeln haben nichts gefunden."));
      return;
    }
    var treffer = 0;
    befunde.forEach(function (f, i) {
      if ((auswahl === "alle" || f.severity === auswahl) && (!nurBelegt || f.bewertet)) {
        an(liste, befundKarte(f, i));
        treffer++;
      }
    });
    if (!treffer) an(liste, el("div", "leer", "Keine Befunde für diese Auswahl."));
  }
  zeigen();

  // ---------------------------------------------------------------- APIs
  if ((B.apis || []).length) {
    an(seite, el("h2", null, "Gelesene APIs"),
       el("p", "abschnitt-x", "Mit den Policies, die im Gateway zugeordnet sind und deshalb ausgewertet wurden."));
    var t = el("table");
    var kopfzeile = el("tr");
    ["API", "Policies", "Fundstelle im Export"].forEach(function (h) { an(kopfzeile, el("th", null, h)); });
    an(t, an(el("thead"), kopfzeile));
    var tb = el("tbody");
    B.apis.forEach(function (a) {
      var zeile = el("tr");
      var pol = el("td");
      if ((a.policies || []).length) a.policies.forEach(function (p) { an(pol, el("span", "pol", p)); });
      else an(pol, el("span", "leise", "keine"));
      an(zeile, el("td", null, a.label || "–"), pol, el("td", "pfad", a.pfad));
      an(tb, zeile);
    });
    an(seite, an(t, tb));
  }

  // ---------------------------------------------------------------- Übersprungen
  if ((B.uebersprungen || []).length) {
    an(seite, el("h2", null, "Übersprungene Dateien"),
       el("p", "abschnitt-x", "Diese Dateien sahen wie Assets aus, wurden aber nicht ausgewertet. Ein Werkzeug, das sagt, was es nicht gelesen hat, ist überprüfbar."));
    var t2 = el("table");
    var kz2 = el("tr");
    ["Grund", "Datei", "Was tun?"].forEach(function (h) { an(kz2, el("th", null, h)); });
    an(t2, an(el("thead"), kz2));
    var tb2 = el("tbody");
    B.uebersprungen.forEach(function (u) {
      var g = GRUND[u.grund] || [u.grund, ""];
      var zeile = el("tr");
      an(zeile, el("td", null, g[0]), el("td", "pfad", u.pfad), el("td", "tun", g[1]));
      an(tb2, zeile);
    });
    an(seite, an(t2, tb2));
  }

  // ---------------------------------------------------------------- Laufzeitlücken
  if ((B.laufzeit_luecken || []).length) {
    an(seite, el("h2", null, "Statisch nicht prüfbar"),
       el("p", "abschnitt-x", "Was auch die Konfiguration nicht beantwortet. Benannt, nie bewertet – das zeigt erst ein Test gegen die laufende API. sectestx testet diese Fragen live in Ihrer Testumgebung."));
    var gl = el("div", "luecken");
    B.laufzeit_luecken.forEach(function (l) {
      var k = el("div", "luecke");
      an(k, el("div", "luecke-t", l.title), el("div", "luecke-x", l.why),
         LUECKE_PRUEFEN[l.key] ? el("div", "luecke-tun", LUECKE_PRUEFEN[l.key]) : null,
         l.owasp ? el("span", "marker", "OWASP " + l.owasp) : null);
      an(gl, k);
    });
    an(seite, gl);
  }

  // ---------------------------------------------------------------- Fuß
  var fuss = el("footer");
  an(fuss, el("span", null, "Erstellt mit " + (B.werkzeug || "wm-audit") + " · statische Analyse, keine Anfrage an die APIs"),
     el("span", "mono", "Format " + (B.format || "") + " · Rohdaten als JSON im Quelltext dieser Datei"));
  an(seite, fuss);
})();
</script>
</body>
</html>
