[project]
name = "oas-audit"
version = "0.2.0"
description = "Statische OWASP-Security-Analyse für OpenAPI-Spezifikationen — ohne einen einzigen Request gegen die API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Christian Ehlert" }]
keywords = ["openapi", "swagger", "security", "owasp", "api-security", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonref>=1.1.0",
]

[project.scripts]
oas-audit = "oas_audit.cli:main"

[project.optional-dependencies]
# Spec-Laden per URL. Bewusst optional: der Kern arbeitet rein auf In-Memory-Daten
# und braucht kein Netzwerk.
fetch = ["httpx>=0.27"]
# Der öffentliche Scan-Dienst. Bewusst optional: CLI und Bibliothek brauchen kein FastAPI.
service = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "fastapi>=0.115",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oas_audit*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
