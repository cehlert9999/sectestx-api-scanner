# /etc/nginx/sites-available/api.sectestx.leanofy.de
# Vorher: A-Record api.sectestx.leanofy.de -> <SERVER-IP> im All-Inkl-KAS,
# dann: certbot --nginx -d api.sectestx.leanofy.de
server {
    listen 80;
    server_name api.sectestx.leanofy.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.sectestx.leanofy.de;

    ssl_certificate     /etc/letsencrypt/live/api.sectestx.leanofy.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sectestx.leanofy.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Zweite Verteidigungslinie vor dem 2-MB-Limit des Dienstes
    client_max_body_size 3m;
    client_body_buffer_size 256k;

    # Kein Access-Log: keine IPs, keine Dateinamen auf Platte
    access_log off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:6010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # nur die direkte Adresse, nie die Kette
        proxy_read_timeout 20s;
        proxy_request_buffering off;                     # streamend, damit das Limit greift
    }
}
