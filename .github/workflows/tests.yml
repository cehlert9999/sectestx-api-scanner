name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,service]" -e ./wm-audit
      - run: ruff check src tests wm-audit/src wm-audit/tests
      - run: pytest -q
      - run: cd wm-audit && pytest -q
